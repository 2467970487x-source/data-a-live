name: probe

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: uname -a
  macos15:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version
  macos15intel:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version
  macoslatest:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version
